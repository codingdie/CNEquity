[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cnequity-query-proxy"
version = "0.1.0"
description = "Standalone read-only HTTP query proxy for CNEquity parquet lakes"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = [
  "duckdb>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
]

[dependency-groups]
dev = [
  "httpx>=0.25",
  "pytest>=8.0",
]

[project.scripts]
cnequity-query-proxy = "cnequity_query_proxy.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
